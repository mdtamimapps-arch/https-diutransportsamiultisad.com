<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DIU SmartBus — Daffodil International University Transport</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ---------- tokens ---------- */
:root{
  --paper:#EEF1EC; --surface:#FFFFFF; --surface-2:#F6F8F4; --line:#DCE2D9; --line-soft:#E8ECE5;
  --ink:#0C1713; --muted:#5C6B63; --faint:#8C9A92;
  --green:#0E6E52; --green-deep:#0A5540; --green-wash:#DDEEE6;
  --yellow:#E8B31C; --yellow-wash:#FBF0D0;
  --red:#B4372B; --red-wash:#F8E3E0;
  --blue:#255E8E; --blue-wash:#E1ECF5;
  --shadow:0 1px 2px rgba(12,23,19,.06), 0 8px 24px -16px rgba(12,23,19,.32);
  --r:14px; --r-sm:9px; --r-lg:20px;
  --f-display:"Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, monospace;
  --nav-w:246px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#06110E; --surface:#0C1B16; --surface-2:#112520; --line:#1E332C; --line-soft:#172A24;
    --ink:#E6EFE9; --muted:#93A69C; --faint:#6D8177;
    --green:#3FBE93; --green-deep:#2E9E79; --green-wash:#0F2E24;
    --yellow:#E8C15A; --yellow-wash:#2D2611;
    --red:#E58072; --red-wash:#331714;
    --blue:#7FB6E0; --blue-wash:#10222F;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 28px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --paper:#06110E; --surface:#0C1B16; --surface-2:#112520; --line:#1E332C; --line-soft:#172A24;
  --ink:#E6EFE9; --muted:#93A69C; --faint:#6D8177;
  --green:#3FBE93; --green-deep:#2E9E79; --green-wash:#0F2E24;
  --yellow:#E8C15A; --yellow-wash:#2D2611;
  --red:#E58072; --red-wash:#331714;
  --blue:#7FB6E0; --blue-wash:#10222F;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 28px -18px rgba(0,0,0,.9);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:var(--f-body);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;letter-spacing:-.018em;line-height:1.12;font-weight:700}
h1{font-size:clamp(26px,4.4vw,34px)}
h2{font-size:20px}
h3{font-size:16px;letter-spacing:-.01em}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--green);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.pad-lg{padding:20px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.between{display:flex;gap:12px;align-items:center;justify-content:space-between}
.grid{display:grid;gap:14px}
.stack{display:grid;gap:14px}
.eyebrow{font-size:12.5px;color:var(--muted);font-weight:500}
.hr{height:1px;background:var(--line-soft);border:0;margin:14px 0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);
  background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer;
  transition:background .14s ease, border-color .14s ease, transform .1s ease}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
:root[data-theme="dark"] .btn.primary,
:root:not([data-theme="light"]) .btn.primary{color:#04140F}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .btn.primary{color:#fff}}
.btn.primary:hover{background:var(--green-deep);border-color:var(--green-deep)}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.block{width:100%}
.btn.big{padding:16px 20px;font-size:17px;border-radius:var(--r);font-family:var(--f-display);font-weight:700}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:17px;height:17px;flex:none}

.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12.5px;
  font-weight:600;background:var(--surface-2);border:1px solid var(--line-soft);white-space:nowrap}
.chip.green{background:var(--green-wash);color:var(--green-deep);border-color:transparent}
.chip.yellow{background:var(--yellow-wash);color:var(--yellow);border-color:transparent}
.chip.red{background:var(--red-wash);color:var(--red);border-color:transparent}
.chip.blue{background:var(--blue-wash);color:var(--blue);border-color:transparent}
:root[data-theme="dark"] .chip.green{color:var(--green)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.pulse{animation:pulse 1.9s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.28}}

.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=email],input[type=password],input[type=search],select,textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:11px 12px;font-size:15px}
input::placeholder{color:var(--faint)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 17px) 52%, calc(100% - 12px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:0 12px 9px;white-space:nowrap}
td{padding:11px 12px;border-top:1px solid var(--line-soft);vertical-align:middle}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

.empty{text-align:center;padding:34px 18px;color:var(--muted)}
.empty h3{margin-bottom:5px;color:var(--ink)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--nav-w) 1fr;min-height:100dvh}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;
  position:sticky;top:0;height:100dvh;padding-top:env(safe-area-inset-top,0px)}
.brandbox{padding:18px 18px 14px;display:flex;gap:11px;align-items:center}
.mark{width:38px;height:38px;border-radius:11px;background:var(--green);display:grid;place-items:center;flex:none}
.mark span{font-family:var(--f-display);font-weight:800;color:#fff;font-size:13px;letter-spacing:.02em}
:root[data-theme="dark"] .mark span{color:#04140F}
.brandbox b{font-family:var(--f-display);font-size:17px;display:block;letter-spacing:-.02em}
.brandbox small{color:var(--faint);font-size:11.5px;display:block;margin-top:1px}
.nav{padding:6px 10px 14px;overflow-y:auto;flex:1}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;text-decoration:none;
  color:var(--muted);font-weight:500;font-size:14.5px;margin-bottom:2px}
.nav a svg{width:18px;height:18px;flex:none;opacity:.85}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--green-wash);color:var(--green-deep);font-weight:600}
:root[data-theme="dark"] .nav a.on{color:var(--green)}
.nav .navlabel{font-size:11.5px;color:var(--faint);padding:14px 11px 6px;font-weight:600}
.sidefoot{border-top:1px solid var(--line-soft);padding:12px;display:grid;gap:8px}
.whoami{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;background:var(--surface-2)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--green-wash);color:var(--green-deep);
  display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;font-family:var(--f-display)}
:root[data-theme="dark"] .avatar{color:var(--green)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:saturate(1.3) blur(10px);border-bottom:1px solid var(--line-soft);
  padding:10px 20px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;gap:12px;align-items:center}
.topbar h2{font-size:17px}
.spacer{flex:1}
.iconbtn{width:37px;height:37px;border-radius:10px;border:1px solid var(--line);background:var(--surface);
  display:grid;place-items:center;cursor:pointer;position:relative;flex:none}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:18px;height:18px}
.badgecount{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;border-radius:9px;background:var(--red);
  color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px;font-family:var(--f-mono)}
.view{padding:20px;max-width:1180px;width:100%;margin:0 auto;flex:1}
.mobnav{display:none}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:60;transform:translateX(-102%);transition:transform .22s ease}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.42)}
  .mobnav{display:grid}
  .view{padding:14px 14px 92px}
  .topbar{padding-inline:14px}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);
    display:flex;justify-content:space-around;padding:7px 4px calc(7px + env(safe-area-inset-bottom,0px))}
  .tabbar a{display:grid;gap:3px;justify-items:center;text-decoration:none;color:var(--faint);font-size:10.5px;
    font-weight:600;padding:4px 8px;border-radius:9px;min-width:56px}
  .tabbar a.on{color:var(--green)}
  .tabbar svg{width:20px;height:20px}
}
@media (min-width:901px){.tabbar{display:none}}

/* ---------- departure hero ---------- */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.hero-top{padding:18px 20px 14px;display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;
  background:linear-gradient(180deg,var(--green-wash),transparent)}
.busno{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,7vw,42px);letter-spacing:-.03em;line-height:1}
.countdown{font-family:var(--f-mono);font-weight:600;font-size:clamp(28px,7vw,40px);letter-spacing:-.04em;line-height:1}
.hero-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));border-top:1px solid var(--line-soft)}
.hero-cell{padding:13px 16px;border-right:1px solid var(--line-soft)}
.hero-cell:last-child{border-right:0}
.hero-cell .k{font-size:12px;color:var(--muted)}
.hero-cell .v{font-family:var(--f-display);font-weight:700;font-size:19px;margin-top:2px}

/* seats */
.seatbar{height:9px;border-radius:999px;background:var(--line-soft);overflow:hidden}
.seatbar i{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .5s cubic-bezier(.3,.8,.3,1)}
.seatbar.warn i{background:var(--yellow)}
.seatbar.full i{background:var(--red)}
.seatgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(13px,1fr));gap:4px}
.seatgrid i{aspect-ratio:1;border-radius:3px;background:var(--line-soft)}
.seatgrid i.on{background:var(--green)}

/* stat tiles */
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow)}
.tile .n{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.03em;line-height:1.05}
.tile .k{font-size:13px;color:var(--muted);margin-top:4px}

/* quick actions */
.qa{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(104px,1fr))}
.qa button{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 10px;
  display:grid;gap:7px;justify-items:center;cursor:pointer;font-size:13px;font-weight:600;box-shadow:var(--shadow)}
.qa button:hover{border-color:var(--green);color:var(--green-deep)}
:root[data-theme="dark"] .qa button:hover{color:var(--green)}
.qa svg{width:21px;height:21px;color:var(--green)}

/* route strip (the recurring motif) */
.strip{display:grid;gap:0;position:relative}
.stop{display:grid;grid-template-columns:26px 1fr auto;gap:12px;align-items:start;padding:0 0 16px;position:relative}
.stop:last-child{padding-bottom:0}
.stop .pin{position:relative;display:grid;place-items:center;padding-top:3px}
.stop .pin b{width:11px;height:11px;border-radius:50%;background:var(--surface);border:2.5px solid var(--line);z-index:2}
.stop:not(:last-child) .pin::after{content:"";position:absolute;top:14px;bottom:-16px;width:2.5px;background:var(--line);left:50%;transform:translateX(-50%)}
.stop.done .pin b{background:var(--green);border-color:var(--green)}
.stop.done:not(:last-child) .pin::after{background:var(--green)}
.stop.here .pin b{background:var(--yellow);border-color:var(--yellow);box-shadow:0 0 0 5px var(--yellow-wash)}
.stop .nm{font-weight:600;font-size:14.5px}
.stop .sub{font-size:12.5px;color:var(--muted)}
.stop .tm{font-family:var(--f-mono);font-size:13px;color:var(--muted)}

/* map */
.mapbox{position:relative;background:var(--surface-2);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.mapbox svg{display:block;width:100%;height:auto}
.maplegend{position:absolute;left:10px;bottom:10px;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:7px 10px;font-size:12px;display:grid;gap:4px;box-shadow:var(--shadow)}

/* chat */
.chatwrap{display:grid;grid-template-rows:1fr auto;height:min(72dvh,620px);border:1px solid var(--line);
  border-radius:var(--r);background:var(--surface);overflow:hidden}
.msgs{overflow-y:auto;padding:16px;display:grid;gap:10px;align-content:start;background:var(--surface-2)}
.msg{max-width:min(78%,560px);background:var(--surface);border:1px solid var(--line-soft);border-radius:14px 14px 14px 4px;padding:9px 12px}
.msg.me{margin-left:auto;background:var(--green-wash);border-color:transparent;border-radius:14px 14px 4px 14px}
.msg .who{font-size:12.5px;font-weight:700;color:var(--green-deep);margin-bottom:2px}
:root[data-theme="dark"] .msg .who{color:var(--green)}
.msg .meta{font-size:11px;color:var(--faint);margin-top:3px;display:flex;gap:6px;align-items:center;justify-content:flex-end}
.msg.sys{max-width:100%;margin:0 auto;background:var(--yellow-wash);border:0;text-align:center;font-size:13px;border-radius:10px}
.composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);align-items:center}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(6,17,14,.5);display:grid;place-items:center;z-index:90;padding:16px;
  animation:fade .16s ease}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--line);width:min(520px,100%);
  max-height:86dvh;overflow:auto;box-shadow:0 30px 70px -30px rgba(0,0,0,.6);animation:pop .18s cubic-bezier(.2,.9,.3,1)}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}
.modal-h{padding:16px 18px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:10px}
.modal-b{padding:18px}
.modal-f{padding:14px 18px;border-top:1px solid var(--line-soft);display:flex;gap:9px;justify-content:flex-end}
.toasts{position:fixed;z-index:100;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:9px;max-width:min(360px,92vw)}
@media (max-width:900px){.toasts{bottom:calc(80px + env(safe-area-inset-bottom,0px));left:14px;right:14px;max-width:none}}
.toast{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:12px;
  padding:11px 13px;box-shadow:var(--shadow);animation:slidein .2s ease}
.toast.warn{border-left-color:var(--yellow)} .toast.err{border-left-color:var(--red)}
.toast b{display:block;font-size:14px} .toast p{font-size:13px;color:var(--muted)}
@keyframes slidein{from{transform:translateX(14px);opacity:0}}

/* notifications panel */
.panel{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--surface);border-left:1px solid var(--line);
  z-index:80;display:flex;flex-direction:column;box-shadow:-20px 0 60px -30px rgba(0,0,0,.6);
  padding-top:env(safe-area-inset-top,0px);animation:slidepanel .2s ease}
@keyframes slidepanel{from{transform:translateX(100%)}}
.panel-h{padding:14px 16px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:10px}
.panel-b{overflow-y:auto;flex:1;padding:12px}
.notif{display:grid;gap:3px;padding:11px;border-radius:11px;border:1px solid var(--line-soft);margin-bottom:8px}
.notif.unread{background:var(--green-wash);border-color:transparent}
.notif b{font-size:13.5px} .notif p{font-size:13px;color:var(--muted)}

/* rfid scanner */
.scanner{border:2px dashed var(--line);border-radius:var(--r-lg);padding:26px 18px;text-align:center;background:var(--surface-2)}
.scanner.busy{border-color:var(--yellow);background:var(--yellow-wash)}
.scanner.ok{border-color:var(--green);border-style:solid;background:var(--green-wash)}
.scanner.bad{border-color:var(--red);border-style:solid;background:var(--red-wash)}
.waves{width:78px;height:78px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;
  background:var(--surface);border:1px solid var(--line);position:relative}
.scanner.busy .waves::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--yellow);animation:ring 1.2s ease-out infinite}
@keyframes ring{from{transform:scale(.8);opacity:.9}to{transform:scale(1.25);opacity:0}}
.waves svg{width:32px;height:32px;color:var(--green)}

/* login */
.auth{min-height:100dvh;display:grid;grid-template-columns:1.05fr .95fr}
@media (max-width:900px){.auth{grid-template-columns:1fr}.authart{display:none}}
.authart{background:var(--green-deep);color:#EAF6F0;padding:44px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.authart h1{font-size:clamp(30px,3.6vw,46px);color:#fff;max-width:14ch}
.authform{display:grid;place-items:center;padding:26px 20px}
.authcard{width:min(420px,100%)}
.demorow{display:flex;gap:9px;align-items:center;width:100%;text-align:left;background:var(--surface-2);
  border:1px solid var(--line);border-radius:11px;padding:9px 11px;cursor:pointer;margin-bottom:7px}
.demorow:hover{border-color:var(--green)}
.demorow .avatar{width:30px;height:30px;font-size:11.5px}
.lockbar{background:var(--red-wash);color:var(--red);border-radius:10px;padding:10px 12px;font-size:13px}

/* misc */
.pass{background:linear-gradient(160deg,var(--green-deep),#07362A);color:#EAF6F0;border-radius:var(--r-lg);padding:20px;position:relative;overflow:hidden}
.pass.expired{background:linear-gradient(160deg,#5A2621,#3A1714)}
.pass.inactive{background:linear-gradient(160deg,#3D4741,#252C28)}
.pass .pname{font-family:var(--f-display);font-size:24px;font-weight:700;color:#fff}
.pass .pk{font-size:11.5px;opacity:.72} .pass .pv{font-weight:600;font-size:14.5px}
.pass .qr{width:64px;height:64px;background:#fff;border-radius:9px;padding:5px}
.barcode{height:34px;display:flex;gap:2px;align-items:stretch;margin-top:14px;opacity:.9}
.barcode i{background:#EAF6F0;border-radius:1px}
.logline{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--line-soft);font-size:13.5px}
.bars{display:grid;gap:9px}
.barrow{display:grid;grid-template-columns:96px 1fr 48px;gap:10px;align-items:center;font-size:13px}
.barrow .track{height:10px;background:var(--line-soft);border-radius:999px;overflow:hidden}
.barrow .track i{display:block;height:100%;background:var(--green);border-radius:999px}
.split{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(288px,1fr))}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;text-align:right}
.secnote{background:var(--blue-wash);border-radius:11px;padding:11px 13px;font-size:13px;color:var(--blue);display:flex;gap:9px}
.secnote svg{width:17px;height:17px;flex:none;margin-top:2px}

.pagehead::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,38,29,.92),rgba(6,38,29,.62) 55%,rgba(6,38,29,.30))}
.pagehead>*{position:relative}
.pagehead h1{color:#fff;text-shadow:0 1px 14px rgba(0,0,0,.35)}
.pagehead p{color:rgba(234,246,240,.88)}
@media (max-width:600px){.pagehead{min-height:118px;padding:16px}.pagehead::before{background:linear-gradient(180deg,rgba(6,38,29,.55),rgba(6,38,29,.93))}}

/* check-in + scanner lights */
.qrcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;text-align:center;box-shadow:var(--shadow)}
.qrbox{width:min(248px,68vw);margin:0 auto;background:#fff;border-radius:14px;padding:12px;box-shadow:0 6px 22px -14px rgba(0,0,0,.5)}
.qrbox svg{display:block;width:100%;height:auto;image-rendering:pixelated}
.qrbox.dead{filter:grayscale(1) opacity(.35)}
.ttl{height:6px;border-radius:999px;background:var(--line-soft);overflow:hidden;margin:14px auto 0;max-width:248px}
.ttl i{display:block;height:100%;background:var(--green);transition:width 1s linear}
.ttl.low i{background:var(--red)}
.light{border-radius:var(--r-lg);padding:26px 18px;text-align:center;border:1px solid var(--line);background:var(--surface-2)}
.light .lamp{width:94px;height:94px;border-radius:50%;margin:0 auto 14px;background:var(--line-soft);display:grid;place-items:center;
  border:6px solid var(--line);transition:background .2s, border-color .2s}
.light .lamp svg{width:40px;height:40px;color:var(--faint)}
.light.granted{background:var(--green-wash);border-color:var(--green)}
.light.granted .lamp{background:var(--green);border-color:color-mix(in srgb,var(--green) 55%,transparent);box-shadow:0 0 0 10px color-mix(in srgb,var(--green) 22%,transparent)}
.light.granted .lamp svg{color:#fff}
.light.denied{background:var(--red-wash);border-color:var(--red)}
.light.denied .lamp{background:var(--red);border-color:color-mix(in srgb,var(--red) 55%,transparent);box-shadow:0 0 0 10px color-mix(in srgb,var(--red) 22%,transparent)}
.light.denied .lamp svg{color:#fff}
.light.reading .lamp{background:var(--yellow);border-color:var(--yellow-wash)}
.light h2{font-size:24px;margin-bottom:4px}
.offbar{display:flex;gap:10px;align-items:center;padding:11px 13px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.offbar.on{background:var(--yellow-wash);border-color:var(--yellow)}
.sw{width:44px;height:25px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none;border:0}
.sw i{position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:var(--surface);transition:left .16s ease}
.sw.on{background:var(--green)} .sw.on i{left:22px}

/* AI chatbot */
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;width:54px;height:54px;border-radius:50%;
  background:var(--green);color:#fff;border:0;display:grid;place-items:center;cursor:pointer;box-shadow:0 12px 26px -10px rgba(0,0,0,.45)}
:root[data-theme="dark"] .fab, :root:not([data-theme="light"]) .fab{color:#04140F}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .fab{color:#fff}}
.fab svg{width:25px;height:25px}
@media (max-width:900px){.fab{bottom:calc(78px + env(safe-area-inset-bottom,0px))}}
.botpanel{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:71;width:min(360px,calc(100vw - 32px));
  height:min(520px,68dvh);background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 26px 60px -20px rgba(0,0,0,.5);
  display:flex;flex-direction:column;overflow:hidden;animation:pop .16s ease}
@media (max-width:900px){.botpanel{bottom:calc(140px + env(safe-area-inset-bottom,0px))}}
.bot-h{padding:12px 14px;border-bottom:1px solid var(--line-soft);display:flex;gap:9px;align-items:center;background:var(--green-wash)}

/* ======================== server/security ==========================
   Everything below this line simulates work that MUST happen on a
   server. The browser never decides a role: it receives a token and
   the "server" resolves identity → role → permission → ownership on
   every single call. Replace Server.handle() with a REST controller.
   ================================================================== */

const PERMISSIONS = {
  student:[ 'profile.self','pass.self','route.read','bus.live','schedule.read','notice.read','chat.read','chat.write','notify.read',
            'checkin.self','fee.self','safety.alert','complaint.self','contacts.read','findbus.read' ],
  faculty:[ 'profile.self','route.read','bus.live','schedule.read','notice.read','chat.read','chat.write','notify.read',
            'safety.alert','complaint.self','contacts.read','findbus.read','shuttle.request' ],
  driver:[ 'profile.self','route.read','bus.live','schedule.read','notice.read','chat.read','chat.write','notify.read',
           'trip.self','trip.start','trip.end','bus.location.update','passenger.read','qr.scan','checkin.read',
           'safety.alert','contacts.read','findbus.read' ],
  volunteer:[ 'profile.self','route.read','bus.live','schedule.read','notice.read','chat.read','chat.write','notify.read',
              'trip.self','trip.start','trip.end','bus.location.update','passenger.read','rfid.scan','pass.verify','qr.scan','checkin.read',
              'safety.alert','contacts.read','findbus.read' ],
  admin:[ 'profile.self','route.read','bus.live','schedule.read','notice.read','chat.read','chat.write','notify.read',
          'fleet.read','bus.manage','route.manage','student.manage','pass.manage','trip.read.all','trip.manage',
          'notice.write','chat.moderate','analytics.read','audit.read','passenger.read','qr.scan','checkin.read','fee.manage',
          'complaint.manage','safety.manage','contacts.read','contacts.manage','findbus.read' ],
  superadmin:['*']
};

/* Password rules live server-side; the client only mirrors them for UX. */
const PASSWORD_POLICY = { min:10, upper:true, digit:true, symbol:true };

const Server = {
  /* --- credential store. Real system: Argon2id, never reversible. --- */
  credentials:{},
  sessions:{},              // token → {userId, role, issuedAt, expiresAt}
  attempts:{},              // email → {count, lockedUntil}
  SESSION_MS: 20*60*1000,   // idle-expiring session
  MAX_ATTEMPTS: 5,
  LOCK_MS: 60*1000,

  /* Demo-only digest. Stands in for Argon2id/bcrypt on the server. */
  hash(pw, salt){
    let h = 0x811c9dc5;
    const s = salt + '|' + pw;
    for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    let out=''; let x=h;
    for(let i=0;i<8;i++){ x = Math.imul(x ^ (i*2654435761), 0x01000193)>>>0; out += x.toString(16).padStart(8,'0'); }
    return out;
  },
  seedCredentials(){
    const demoPw = 'JaJa@Demo2026';
    ['student@demo.com','driver@demo.com','volunteer@demo.com','admin@demo.com','superadmin@demo.com','faculty@demo.com'].forEach(e=>{
      const salt = Math.random().toString(36).slice(2,12);
      this.credentials[e] = { salt, hash: this.hash(demoPw, salt), mustRotate:false };
    });
  },

  checkPassword(pw){
    const f=[];
    if(pw.length < PASSWORD_POLICY.min) f.push('at least 10 characters');
    if(!/[A-Z]/.test(pw)) f.push('an uppercase letter');
    if(!/[0-9]/.test(pw)) f.push('a number');
    if(!/[^A-Za-z0-9]/.test(pw)) f.push('a symbol');
    return f;
  },

  /* --- input sanitising. Stored content is escaped on render too. --- */
  clean(s, max=500){ return String(s==null?'':s).replace(/[\u0000-\u001F\u007F]/g,'').slice(0,max).trim(); },

  audit(event, actorId, detail, ok=true){
    DATA.audit.unshift({ id:'a'+Date.now()+Math.random().toString(16).slice(2,6), at:Date.now(),
      event, actorId, actor:(DATA.users.find(u=>u.id===actorId)||{}).name || 'anonymous',
      role:(DATA.users.find(u=>u.id===actorId)||{}).role || '—', detail, ok, ip:'10.24.'+(actorId?17:99)+'.'+(actorId?8:4) });
    if(DATA.audit.length>400) DATA.audit.length=400;
  },

  /* ------------------------------ login ------------------------------ */
  login(emailRaw, pw){
    const email = this.clean(emailRaw,120).toLowerCase();
    const a = this.attempts[email] || (this.attempts[email]={count:0, lockedUntil:0});
    if(a.lockedUntil > Date.now()){
      this.audit('login.blocked', null, 'Locked after repeated failures · '+mask(email), false);
      return { ok:false, code:'LOCKED', wait: Math.ceil((a.lockedUntil-Date.now())/1000) };
    }
    const user = DATA.users.find(u=>u.email===email);
    const cred = this.credentials[email];
    const good = !!(user && cred && cred.hash === this.hash(pw, cred.salt));
    if(!good){
      a.count++;
      if(a.count >= this.MAX_ATTEMPTS){ a.lockedUntil = Date.now()+this.LOCK_MS; a.count=0; }
      this.audit('login.failed', null, 'Wrong credentials · '+mask(email), false);
      /* Deliberately identical message for unknown user and wrong password. */
      return { ok:false, code:'BAD_CREDENTIALS', left: Math.max(0, this.MAX_ATTEMPTS - a.count) };
    }
    a.count=0; a.lockedUntil=0;
    const token = 'jj_'+Math.random().toString(36).slice(2)+Date.now().toString(36);
    this.sessions[token] = { userId:user.id, role:user.role, issuedAt:Date.now(), expiresAt:Date.now()+this.SESSION_MS };
    this.audit('login.success', user.id, 'Signed in as '+user.role);
    return { ok:true, token, expiresAt:this.sessions[token].expiresAt };
  },
  logout(token){
    const s = this.sessions[token];
    if(s) this.audit('logout', s.userId, 'Session ended and token revoked');
    delete this.sessions[token];
    return {ok:true};
  },
  resolve(token){
    const s = this.sessions[token];
    if(!s) return null;
    if(s.expiresAt < Date.now()){ delete this.sessions[token]; return null; }
    s.expiresAt = Date.now()+this.SESSION_MS;   // sliding expiry
    return s;
  },
  can(role, perm){
    const p = PERMISSIONS[role]||[];
    return p.includes('*') || p.includes(perm);
  },

  /* --------------------------- endpoints ----------------------------- */
  /* Each entry: required permission + handler(ctx, body). Handlers do the
     ownership checks — a student may only read their own route/pass. */
  routes:{
    'me':{ perm:'profile.self', fn:(ctx)=>{
      const u = DATA.users.find(x=>x.id===ctx.userId);
      const st = DATA.students.find(s=>s.id===ctx.userId);
      return { id:u.id, name:u.name, role:u.role, email:u.email, routeId:u.routeId||null, busId:u.busId||null,
               student: st ? {studentId:st.studentId, dept:st.dept, semester:st.semester} : null,
               permissions: PERMISSIONS[u.role] };
    }},

    'pass.self':{ perm:'pass.self', fn:(ctx)=>{
      const st = DATA.students.find(s=>s.id===ctx.userId);
      if(!st) throw err(404,'No transport pass is linked to this account.');
      return { ...st.pass, name:st.name, studentId:st.studentId, dept:st.dept, semester:st.semester,
               routeId:st.routeId, uid:maskUid(st.uid) };
    }},

    'routes':{ perm:'route.read', fn:(ctx)=>{
      if(ctx.role==='student'||ctx.role==='faculty'){
        const own = DATA.routes.find(r=>r.id===ctx.routeId);
        return DATA.routes.map(r=> r.id===ctx.routeId ? r : {id:r.id,name:r.name,label:r.label,color:r.color,stops:r.stops,restricted:true});
      }
      return DATA.routes;
    }},

    'buses':{ perm:'bus.live', fn:(ctx)=>{
      let list = DATA.buses;
      if(ctx.role==='student'||ctx.role==='faculty') list = list.filter(b=>b.routeId===ctx.routeId);
      if(ctx.role==='driver'||ctx.role==='volunteer') list = list.filter(b=>b.id===ctx.busId||b.routeId===ctx.routeId);
      return list.map(b=>publicBus(b));
    }},

    'fleet':{ perm:'fleet.read', fn:()=> DATA.buses.map(b=>publicBus(b)) },

    'trips.active':{ perm:'bus.live', fn:(ctx)=>{
      let t = DATA.trips.filter(t=>t.state!=='COMPLETED');
      if(ctx.role==='student'||ctx.role==='faculty') t = t.filter(x=>x.routeId===ctx.routeId);
      return t.map(x=>publicTrip(x, ctx.role));
    }},
    'trips.all':{ perm:'trip.read.all', fn:()=> DATA.trips.map(t=>publicTrip(t,'admin')) },
    'trips.mine':{ perm:'trip.self', fn:(ctx)=> DATA.trips.filter(t=>t.busId===ctx.busId).map(t=>publicTrip(t,ctx.role)) },

    'trip.start':{ perm:'trip.start', fn:(ctx, body)=>{
      const bus = DATA.buses.find(b=>b.id===ctx.busId);
      if(!bus) throw err(403,'You are not assigned to a bus.');
      if(bus.status==='maintenance') throw err(409,'This bus is marked for maintenance. Ask the fleet desk to release it.');
      if(DATA.trips.some(t=>t.busId===bus.id && t.state!=='COMPLETED')) throw err(409,'A trip is already running on this bus.');
      const trip = { id:'T-'+(++DATA.tripSeq), busId:bus.id, routeId:bus.routeId, state:'BOARDING',
        startedAt:Date.now(), endedAt:null, startedBy:ctx.userId, passengers:0, boarded:{}, progress:0,
        stopIndex:0, gps:true, manual:null, capacity:bus.capacity };
      DATA.trips.unshift(trip);
      bus.status='active';
      Server.audit('trip.start', ctx.userId, trip.id+' started on '+bus.id+' · boarding open');
      Notify.push({scope:'route', routeId:bus.routeId, title:'Bus '+bus.id+' has started its trip', body:'Boarding is open at the first stop.'});
      return publicTrip(trip, ctx.role);
    }},

    'trip.end':{ perm:'trip.end', fn:(ctx)=>{
      const trip = DATA.trips.find(t=>t.busId===ctx.busId && t.state!=='COMPLETED');
      if(!trip) throw err(404,'No running trip on your bus.');
      trip.state='COMPLETED'; trip.endedAt=Date.now(); trip.gps=false;
      const bus = DATA.buses.find(b=>b.id===trip.busId); if(bus) bus.status='idle';
      Server.audit('trip.end', ctx.userId, trip.id+' completed · '+trip.passengers+' passengers recorded');
      Notify.push({scope:'route', routeId:trip.routeId, title:'Bus '+trip.busId+' has arrived', body:trip.passengers+' passengers travelled on this trip.'});
      return publicTrip(trip, ctx.role);
    }},

    'trip.state':{ perm:'trip.self', fn:(ctx, body)=>{
      const trip = DATA.trips.find(t=>t.busId===ctx.busId && t.state!=='COMPLETED');
      if(!trip) throw err(404,'No running trip on your bus.');
      const allowed=['BOARDING','TRIP STARTED','IN TRANSIT','ARRIVED'];
      if(!allowed.includes(body.state)) throw err(400,'Unknown trip state.');
      trip.state = body.state;
      Server.audit('trip.state', ctx.userId, trip.id+' → '+body.state);
      return publicTrip(trip, ctx.role);
    }},

    /* RFID boarding: the duplicate rule is enforced here, server-side,
       against the trip record — never in the scanner UI. */
    'rfid.scan':{ perm:'rfid.scan', fn:(ctx, body)=>{
      const trip = DATA.trips.find(t=>t.busId===ctx.busId && t.state!=='COMPLETED');
      if(!trip) throw err(409,'Start a trip before scanning cards.');
      const uid = Server.clean(body.uid, 32);
      const st = DATA.students.find(s=>s.uid===uid);
      if(!st){
        Server.audit('rfid.reject', ctx.userId, 'Unknown card '+maskUid(uid)+' on '+trip.busId, false);
        return { result:'UNKNOWN_CARD', message:'This card is not registered in the transport system.' };
      }
      if(st.pass.status!=='ACTIVE'){
        Server.audit('rfid.reject', ctx.userId, mask(st.studentId)+' pass '+st.pass.status+' on '+trip.busId, false);
        return { result:'REJECTED', reason:st.pass.status, student:safeStudent(st), message:'Transport pass is '+st.pass.status.toLowerCase()+'.' };
      }
      if(st.routeId !== trip.routeId){
        Server.audit('rfid.reject', ctx.userId, mask(st.studentId)+' wrong route on '+trip.busId, false);
        return { result:'WRONG_ROUTE', student:safeStudent(st),
                 message:'This pass is issued for '+routeName(st.routeId)+', not '+routeName(trip.routeId)+'.' };
      }
      if(trip.boarded[uid]){
        Server.audit('rfid.duplicate', ctx.userId, mask(st.studentId)+' scanned again on '+trip.id, false);
        return { result:'DUPLICATE', student:safeStudent(st), boardedAt:trip.boarded[uid],
                 passengers:trip.passengers, capacity:trip.capacity, message:'Already boarded this trip.' };
      }
      if(trip.passengers >= trip.capacity){
        Server.audit('rfid.reject', ctx.userId, 'Bus full on '+trip.id, false);
        return { result:'FULL', student:safeStudent(st), passengers:trip.passengers, capacity:trip.capacity,
                 message:'Bus is full. Ask the student to wait for the next bus.' };
      }
      trip.boarded[uid]=Date.now(); trip.passengers++;
      DATA.boardings.unshift({ tripId:trip.id, busId:trip.busId, studentId:st.studentId, at:Date.now(), by:ctx.userId });
      Server.audit('rfid.boarding', ctx.userId, mask(st.studentId)+' boarded '+trip.busId+' · seat '+trip.passengers+'/'+trip.capacity);
      const left = trip.capacity - trip.passengers;
      if(left===0) Notify.push({scope:'route',routeId:trip.routeId,title:'Bus '+trip.busId+' is full',body:'No seats left on this trip.',level:'err'});
      else if(left<=5) Notify.push({scope:'route',routeId:trip.routeId,title:'Only '+left+' seats left on '+trip.busId,body:'Seats are filling up fast.',level:'warn'});
      return { result:'APPROVED', student:safeStudent(st), passengers:trip.passengers, capacity:trip.capacity, seatsLeft:left };
    }},

    'pass.verify':{ perm:'pass.verify', fn:(ctx, body)=>{
      const st = DATA.students.find(s=>s.studentId===Server.clean(body.studentId,20));
      if(!st) throw err(404,'No student matches that ID.');
      Server.audit('pass.verify', ctx.userId, 'Checked pass for '+mask(st.studentId));
      return { ...safeStudent(st), pass:st.pass };
    }},

    'bus.location':{ perm:'bus.location.update', fn:(ctx, body)=>{
      const trip = DATA.trips.find(t=>t.busId===ctx.busId && t.state!=='COMPLETED');
      if(!trip) throw err(409,'Start a trip before updating the location.');
      const route = DATA.routes.find(r=>r.id===trip.routeId);
      const idx = route.stops.findIndex(s=>s.id===body.stopId);
      if(idx<0) throw err(400,'That stop is not on this route.');
      trip.stopIndex = idx; trip.progress = idx/(route.stops.length-1);
      trip.manual = { stop:route.stops[idx].name, at:Date.now(), by:ctx.userId };
      trip.gps = false; trip.lastUpdate = Date.now();
      Server.audit('location.manual', ctx.userId, trip.busId+' set to '+route.stops[idx].name+' (GPS unavailable)');
      Notify.push({scope:'route', routeId:trip.routeId, title:'Bus '+trip.busId+' was manually updated to '+route.stops[idx].name,
                   body:'GPS is unavailable, so staff updated the location by hand.'});
      return publicTrip(trip, ctx.role);
    }},
    'gps.toggle':{ perm:'bus.location.update', fn:(ctx, body)=>{
      const trip = DATA.trips.find(t=>t.busId===ctx.busId && t.state!=='COMPLETED');
      if(!trip) throw err(409,'No running trip.');
      trip.gps = !!body.on; if(trip.gps) trip.manual=null;
      Server.audit('gps.toggle', ctx.userId, trip.busId+' GPS '+(trip.gps?'active':'unavailable'));
      return publicTrip(trip, ctx.role);
    }},

    'notices':{ perm:'notice.read', fn:(ctx)=>{

    'chat.read':{ perm:'chat.read', fn:(ctx, body)=>{
      const routeId = body.routeId;
      /* Resource ownership: students/faculty may only open their own route group. */
      if((ctx.role==='student'||ctx.role==='faculty') && routeId!==ctx.routeId) throw err(403,'You can only open the chat for your assigned route.');
      if((ctx.role==='driver'||ctx.role==='volunteer')){

    'chat.send':{ perm:'chat.write', fn:(ctx, body)=>{

    'chat.report':{ perm:'chat.read', fn:(ctx, body)=>{

    'chat.delete':{ perm:'chat.moderate', fn:(ctx, body)=>{

    /* ---------------- Smart check-in & QR verification ---------------- */
    /* A check-in token is minted server-side and signed. The phone only
       draws it. Copying the picture does not help: the signature covers
       the student, route and minute it was issued, it dies after 90s and
       the server burns it the first time a scanner uses it. */
    'checkin.create':{ perm:'checkin.self', fn:(ctx)=>{
      const st = DATA.students.find(s=>s.id===ctx.userId);
      if(!st) throw err(404,'No student record is linked to this account.');
      if(st.blocked) throw err(423,'Bus access is restricted on your account. '+(st.blockReason||''));
      const token = Tokens.mint(st);
      Server.audit('checkin.issue', ctx.userId, 'Check-in code issued for '+routeName(st.routeId)+' · valid 90s');
      return { token, issuedAt:Date.now(), ttl:Tokens.TTL, route:routeName(st.routeId),
               fee:st.fee, pass:st.pass.status };
    }},
    'checkin.self':{ perm:'checkin.self', fn:(ctx)=>{
      const st = DATA.students.find(s=>s.id===ctx.userId);
      const today = DATA.checkins.filter(c=>c.studentId===st.studentId).slice(0,6);
      return { fee:st.fee, blocked:st.blocked, blockReason:st.blockReason, pass:st.pass.status, history:today };
    }},

    'qr.verify':{ perm:'qr.scan', fn:(ctx, body)=>{
      const scannedAt = body.offlineAt || Date.now();
      const offline = !!body.offlineAt;
      const trip = DATA.trips.find(t=>t.busId===ctx.busId && t.state!=='COMPLETED')
                || (ctx.role==='admin'||ctx.role==='superadmin' ? DATA.trips.find(t=>t.state!=='COMPLETED') : null);
      const deny = (reason, message, st)=>{
        const rec = { id:'c'+Date.now()+Math.random().toString(16).slice(2,5), at:scannedAt, offline,
          studentId: st?st.studentId:'—', name: st?st.name:'Unknown card', busId: trip?trip.busId:(ctx.busId||'—'),
          tripId: trip?trip.id:'—', result:'DENIED', reason, by:ctx.userId };
        DATA.checkins.unshift(rec);
        Server.audit('checkin.denied', ctx.userId, (st?mask(st.studentId):'unknown')+' denied on '+(trip?trip.busId:'—')+' · '+reason, false);
        return { result:'DENIED', reason, message, student: st?safeStudent(st):null, offline,
                 trip: trip?publicTrip(trip,ctx.role):null };
      };
      if(!trip) throw err(409,'Start a trip before scanning check-in codes.');
      const parsed = Tokens.verify(Server.clean(body.token, 200), scannedAt);
      if(parsed.bad==='SIGNATURE') return deny('INVALID','This code was not issued by DIU SmartBus, or it has been altered.');
      if(parsed.bad==='EXPIRED') return deny('EXPIRED','This code is older than 90 seconds. Ask the student to refresh it.');
      if(parsed.bad==='USED') return deny('DUPLICATE','This code has already been scanned once.', parsed.student);
      const st = parsed.student;
      if(!st) return deny('INVALID','No student matches this code.');
      if(st.blocked) return deny('BLOCKED','Bus access is restricted on this account. Send the student to the transport office.', st);
      if(st.pass.status!=='ACTIVE') return deny('PASS_'+st.pass.status,'Transport pass is '+st.pass.status.toLowerCase()+'.', st);
      if(st.routeId!==trip.routeId) return deny('WRONG_BUS','This code is for '+routeName(st.routeId)+', not '+routeName(trip.routeId)+'.', st);
      if(st.fee.status!=='PAID'){
        /* Fee bypass detected. Policy fine is raised automatically and the
           account is restricted until the office reviews it. */
        st.fee.fines += 800;
        st.blocked = true; st.blockReason = 'Boarded without a paid transport fee on '+new Date(scannedAt).toLocaleDateString();
        DATA.violations.unshift({ id:'v'+Date.now(), at:scannedAt, studentId:st.studentId, name:st.name,
          busId:trip.busId, tripId:trip.id, kind:'FEE_BYPASS', fine:800, status:'OPEN', by:ctx.userId });
        Server.audit('fee.bypass', ctx.userId, mask(st.studentId)+' attempted boarding with an unpaid fee · ৳800 fine raised', false);
        Notify.push({scope:'all', title:'Fee bypass detected on '+trip.busId, body:st.name+' tried to board without a paid transport fee. A ৳800 fine was raised.', level:'err'});
        return deny('FEE_UNPAID','Transport fee is unpaid. A ৳800 fine has been recorded and access is now restricted.', st);
      }
      if(trip.boarded['qr:'+st.uid]) return deny('DUPLICATE','Already checked in on this trip.', st);
      if(trip.passengers >= trip.capacity) return deny('FULL','Bus is full. Ask the student to wait for the next bus.', st);

      Tokens.burn(parsed.token);
      trip.boarded['qr:'+st.uid] = scannedAt; trip.passengers++;
      DATA.boardings.unshift({ tripId:trip.id, busId:trip.busId, studentId:st.studentId, at:scannedAt, by:ctx.userId });
      DATA.checkins.unshift({ id:'c'+Date.now()+Math.random().toString(16).slice(2,5), at:scannedAt, offline,
        studentId:st.studentId, name:st.name, busId:trip.busId, tripId:trip.id, result:'GRANTED', reason:'OK', by:ctx.userId });
      Server.audit('checkin.granted', ctx.userId, mask(st.studentId)+' checked in on '+trip.busId+(offline?' (queued offline)':'')+' · seat '+trip.passengers+'/'+trip.capacity);
      const left = trip.capacity-trip.passengers;
      if(left<=5 && left>0) Notify.push({scope:'route',routeId:trip.routeId,title:'Only '+left+' seats left on '+trip.busId,body:'Seats are filling up fast.',level:'warn'});
      return { result:'GRANTED', student:safeStudent(st), passengers:trip.passengers, capacity:trip.capacity,
               seatsLeft:left, offline, trip:publicTrip(trip,ctx.role) };
    }},

    /* The scanner holds queued scans while it is offline and replays them
       here. Each one is re-checked with the time it happened, so an
       offline scan cannot be used to slip past an expired code. */
    'scan.sync':{ perm:'qr.scan', fn:(ctx, body)=>{
      const queue = Array.isArray(body.queue)? body.queue.slice(0,50) : [];
      const results = queue.map(q=>{
        try{ return { at:q.at, ...Server.routes['qr.verify'].fn(ctx, {token:q.token, offlineAt:q.at}) }; }
        catch(e){ return { at:q.at, result:'DENIED', reason:'SYNC_ERROR', message:e.message }; }
      });
      Server.audit('scan.sync', ctx.userId, queue.length+' offline scan'+(queue.length===1?'':'s')+' synced from '+(ctx.busId||'scanner'));
      return { synced:results.length, results };
    }},

    /* Demo helper only. A real scanner reads the code off the phone's
       screen; here the office tablet mints one so the flow is testable. */
    'qr.demoToken':{ perm:'qr.scan', fn:(ctx, body)=>{
      const trip = DATA.trips.find(t=>t.busId===ctx.busId && t.state!=='COMPLETED');
      const routeId = trip? trip.routeId : DATA.routes[0].id;
      const pool = DATA.students.filter(s=>s.routeId===routeId);
      let st;
      if(body.kind==='unpaid') st = DATA.students.find(s=>s.fee.status!=='PAID' && s.routeId===routeId && !s.blocked) || DATA.students.find(s=>s.fee.status!=='PAID');
      else if(body.kind==='blocked') st = DATA.students.find(s=>s.blocked) || pool[0];
      else if(body.kind==='expired') st = pool.find(s=>s.pass.status!=='ACTIVE') || pool[1];
      else if(body.kind==='other') st = DATA.students.find(s=>s.routeId!==routeId && s.fee.status==='PAID' && !s.blocked);
      else st = pool.find(s=>s.pass.status==='ACTIVE' && s.fee.status==='PAID' && !s.blocked && !(trip&&trip.boarded['qr:'+s.uid])) || pool[0];
      if(!st) throw err(404,'No demo student fits that case.');
      const tok = Tokens.mint(st);
      if(body.kind==='stale') Tokens.age(tok, 120000);
      if(body.kind==='forged') return { token: tok.slice(0,-4)+'0000', who:st.name };
      return { token:tok, who:st.name };
    }},

    'checkins':{ perm:'checkin.read', fn:(ctx, body)=>{
      const q=(body&&body.q||'').toLowerCase();
      let list = DATA.checkins;
      if(ctx.role==='driver'||ctx.role==='volunteer') list = list.filter(c=>c.busId===ctx.busId);
      return list.filter(c=>!q || c.name.toLowerCase().includes(q) || c.busId.toLowerCase().includes(q) || c.result.toLowerCase().includes(q))
        .slice(0,120).map(c=>({...c, studentId:mask(c.studentId)}));
    }},
    'violations':{ perm:'fee.manage', fn:()=> DATA.violations.map(v=>({...v, studentIdMasked:mask(v.studentId)})) },
    'fee.action':{ perm:'fee.manage', fn:(ctx, body)=>{
      const st = DATA.students.find(s=>s.studentId===body.studentId);
      if(!st) throw err(404,'Student not found.');
      const reason = Server.clean(body.reason, 200);
      if(!reason) throw err(400,'Write the reason for this decision — it is stored with your name.');
      const v = DATA.violations.find(x=>x.id===body.violationId);
      if(body.action==='restore'){
        st.blocked=false; st.blockReason=null;
        if(v){ v.status='RESTORED'; v.note=reason; v.decidedBy=ctx.userId; }
        Server.audit('access.restore', ctx.userId, mask(st.studentId)+' bus access restored · '+reason);
      } else if(body.action==='waive'){
        st.fee.fines = Math.max(0, st.fee.fines-800); st.blocked=false; st.blockReason=null;
        if(v){ v.status='WAIVED'; v.note=reason; v.decidedBy=ctx.userId; }
        Server.audit('fine.waive', ctx.userId, '৳800 fine waived for '+mask(st.studentId)+' · '+reason);
      } else if(body.action==='markpaid'){
        st.fee.status='PAID'; st.fee.paidOn=new Date().toLocaleDateString(); st.blocked=false; st.blockReason=null;
        if(v){ v.status='SETTLED'; v.note=reason; v.decidedBy=ctx.userId; }
        Server.audit('fee.paid', ctx.userId, mask(st.studentId)+' transport fee marked paid · '+reason);
      } else if(body.action==='restrict'){
        st.blocked=true; st.blockReason=reason;
        Server.audit('access.restrict', ctx.userId, mask(st.studentId)+' bus access restricted · '+reason, false);
      } else throw err(400,'Unknown action.');
      return { studentId:st.studentId, blocked:st.blocked, fee:st.fee };
    }},

    /* ---------------------- safety, complaints, contacts, faculty ------ */

        routeId: ctx.routeId || (trip?trip.routeId:null), busId: trip?trip.busId:(ctx.busId||null),

    'contacts':{ perm:'contacts.read', fn:()=> DATA.contacts },
    'contacts.save':{ perm:'contacts.manage', fn:(ctx, body)=>{
      const list = Array.isArray(body.contacts)? body.contacts : DATA.contacts;
      DATA.contacts = list.map(c=>({dept:Server.clean(c.dept,60), name:Server.clean(c.name,80), phone:Server.clean(c.phone,40), hours:Server.clean(c.hours,40)}));
      Server.audit('contacts.update', ctx.userId, 'Transport office directory updated');

    }},

    'complaint.create':{ perm:'complaint.self', fn:(ctx, body)=>{
      const u = DATA.users.find(x=>x.id===ctx.userId);

        cat, busId: Server.clean(body.busId,20)||null, routeId: ctx.routeId||null, text,
        status:'OPEN', response:null };
      DATA.complaints.unshift(c);
      Server.audit('complaint.submit', ctx.userId, u.name+' filed a '+cat.toLowerCase()+' complaint'+(c.busId?' about '+c.busId:''));
      Notify.push({scope:'all', title:'New complaint: '+cat, body:u.name+' — '+text.slice(0,80), level:'warn'});
      return c;
    }},
    'complaint.mine':{ perm:'complaint.self', fn:(ctx)=> DATA.complaints.filter(c=>c.by===ctx.userId) },
    'complaints':{ perm:'complaint.manage', fn:(ctx, body)=>{
      const q=(body&&body.q||'').toLowerCase();
      return DATA.complaints.filter(c=>!q||c.cat.toLowerCase().includes(q)||c.name.toLowerCase().includes(q)||c.text.toLowerCase().includes(q));
    }},

      Server.audit('complaint.respond', ctx.userId, 'Responded to complaint from '+c.name+' → '+c.status);
      return c;
    }},

    'shuttle.request':{ perm:'shuttle.request', fn:(ctx, body)=>{
      const u = DATA.users.find(x=>x.id===ctx.userId);
      const text = Server.clean(body.text,300);
      if(!text) throw err(400,'Describe the pickup you need.');

    }},
    'analytics':{ perm:'analytics.read', fn:()=> DATA.analytics },
    'audit':{ perm:'audit.read', fn:(ctx, body)=>{
      const q=(body&&body.q||'').toLowerCase();
      return DATA.audit.filter(a=>!q||a.event.includes(q)||a.actor.toLowerCase().includes(q)).slice(0,120);
    }},
    'users':{ perm:'*', fn:()=> DATA.users.map(u=>({id:u.id,name:u.name,email:mask(u.email),role:u.role,
        scope:u.routeId?routeName(u.routeId):(u.busId||'—')})) },
    'role.set':{ perm:'*', fn:(ctx, body)=>{
      const u = DATA.users.find(x=>x.id===body.id);
      if(!u) throw err(404,'User not found.');
      if(u.id===ctx.userId) throw err(400,'You cannot change your own role.');
      const was=u.role; u.role=body.role;
      Server.audit('role.change', ctx.userId, u.name+': '+was+' → '+body.role);
      return {ok:true};
    }},
    'sessions':{ perm:'*', fn:()=> Object.entries(Server.sessions).map(([t,s])=>({
        token:t.slice(0,9)+'…', user:(DATA.users.find(u=>u.id===s.userId)||{}).name, role:s.role,
        issued:s.issuedAt, expires:s.expiresAt })) }
  },

  /* The single gate every request passes through. */
  handle(token, endpoint, body){
    const session = this.resolve(token);
    if(!session) throw err(401,'Your session has expired. Sign in again.');
    const route = this.routes[endpoint];
    if(!route) throw err(404,'Unknown endpoint.');
    if(!this.can(session.role, route.perm)){
      this.audit('authz.denied', session.userId, 'Blocked '+endpoint+' — role '+session.role+' lacks '+route.perm, false);
      throw err(403,'Your role does not have permission for this action.');
    }
    const u = DATA.users.find(x=>x.id===session.userId);
    const ctx = { userId:session.userId, role:session.role, routeId:u.routeId, busId:u.busId };
    return route.fn(ctx, body||{});
  }
};


/* ---------------------- check-in token service ----------------------
   Stands in for an HMAC signed, single-use QR payload. In production the
   secret lives only on the server and the code is signed with HMAC-SHA256.
   -------------------------------------------------------------------- */
const Tokens = {
  SECRET:'demo-server-secret-'+Math.random().toString(36).slice(2),
  TTL: 90000,
  issued:{},   // token → {sid, issuedAt}
  used:{},     // token → burnt at
  mint(st){
    const issuedAt = Date.now(), nonce = Math.random().toString(36).slice(2,10);
    const payload = ['JJ1', st.studentId, st.routeId, issuedAt, nonce].join('~');
    const sig = Server.hash(this.SECRET+'|'+payload, 'checkin').slice(0,20);
    const token = payload+'~'+sig;
    this.issued[token] = { sid:st.studentId, issuedAt };
    return token;
  },
  age(token, ms){ if(this.issued[token]) this.issued[token].issuedAt -= ms; },
  verify(token, at){
    const parts = String(token||'').split('~');
    if(parts.length!==6 || parts[0]!=='JJ1') return {bad:'SIGNATURE'};
    const payload = parts.slice(0,5).join('~');
    const sig = Server.hash(this.SECRET+'|'+payload, 'checkin').slice(0,20);
    if(sig !== parts[5]) return {bad:'SIGNATURE'};
    const st = DATA.students.find(s=>s.studentId===parts[1]);
    const issuedAt = this.issued[token] ? this.issued[token].issuedAt : +parts[3];
    if(this.used[token]) return {bad:'USED', student:st};
    if((at - issuedAt) > this.TTL || at < issuedAt - 5000) return {bad:'EXPIRED', student:st};
    return { token, student:st, issuedAt };
  },
  burn(token){ this.used[token] = Date.now(); delete this.issued[token]; }
};

function err(status,msg){ const e=new Error(msg); e.status=status; return e; }
function mask(s){ s=String(s||''); if(s.includes('@')){const[a,b]=s.split('@');return a.slice(0,2)+'•••@'+b;} return s.length>4? s.slice(0,4)+'••'+s.slice(-2) : '••••'; }
function maskUid(u){ return String(u||'').split(':').map((p,i)=> i<2?p:'••').join(':'); }
function routeName(id){ const r=DATA.routes.find(x=>x.id===id); return r?r.name:id; }
function safeStudent(s){ return { id:s.id, name:s.name, studentId:s.studentId, routeId:s.routeId, dept:s.dept, semester:s.semester }; }
function publicBus(b){
  const trip = DATA.trips.find(t=>t.busId===b.id && t.state!=='COMPLETED');
  return { id:b.id, routeId:b.routeId, capacity:b.capacity, status:b.status, plate:b.plate,
    trip: trip?publicTrip(trip,'admin'):null };
}
function publicTrip(t, role){
  const route = DATA.routes.find(r=>r.id===t.routeId);
  const i = Math.min(route.stops.length-1, Math.round(t.progress*(route.stops.length-1)));
  return { id:t.id, busId:t.busId, routeId:t.routeId, state:t.state, startedAt:t.startedAt, endedAt:t.endedAt,
    passengers:t.passengers, capacity:t.capacity, seatsLeft:t.capacity-t.passengers, progress:t.progress,
    nearStop:route.stops[i].name, stopIndex:i, gps:t.gps, manual:t.manual, lastUpdate:t.lastUpdate||t.startedAt,
    boardedCount:Object.keys(t.boarded).length };
}
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================ api/client ============================
   The only bridge between the UI and the backend. Swap the body of
   call() for fetch('/api/'+endpoint, {credentials:'include'}) and the
   whole app keeps working.
   ================================================================== */
const API = {
  token:null,
  log:[],
  latency(){ return 120 + Math.random()*220; },
  async call(endpoint, body){
    const started = Date.now();
    await new Promise(r=>setTimeout(r, this.latency()));
    try{
      const data = Server.handle(this.token, endpoint, body);
      this._log(endpoint, 200, Date.now()-started);
      return data;
    }catch(e){
      this._log(endpoint, e.status||500, Date.now()-started, e.message);
      if(e.status===401){ Session.expire(); }
      throw e;
    }
  },
  async login(email, pw){
    await new Promise(r=>setTimeout(r, 420));
    const res = Server.login(email, pw);
    this._log('auth/login', res.ok?200:(res.code==='LOCKED'?429:401), 420);
    if(res.ok) this.token = res.token;
    return res;
  },
  async logout(){ Server.logout(this.token); this._log('auth/logout',200,10); this.token=null; },
  _log(ep, status, ms, msg){
    this.log.unshift({ep, status, ms:Math.round(ms), msg, at:Date.now()});
    if(this.log.length>60) this.log.length=60;
  }
};

/* Replace with: GPS webhooks, an RFID reader over WebUSB/serial, and a
   websocket channel. The rest of the app is already event-driven.      */
const Sim = {
  tick(){
    DATA.trips.forEach(t=>{
      if(t.state==='COMPLETED' || !t.gps) return;
      const stops = DATA.routes.find(r=>r.id===t.routeId).stops.length-1;
      t.progress = Math.min(1, t.progress + 0.014 + Math.random()*0.01);
      t.lastUpdate = Date.now();
      const i = Math.round(t.progress*stops);
      if(t.progress>0.02 && t.state==='BOARDING') t.state='TRIP STARTED';
      else if(t.progress>0.08 && t.state==='TRIP STARTED') t.state='IN TRANSIT';
      if(t.progress>=1 && t.state!=='ARRIVED'){
        t.state='ARRIVED';
        Notify.push({scope:'route',routeId:t.routeId,title:'Bus '+t.busId+' reached the campus',body:'Trip '+t.id+' is ready to be closed.'});
      }
      if(i!==t.stopIndex){ t.stopIndex=i; }
      /* Other buses pick up riders on their own. */
      if(t.busId!==(State.user&&State.user.busId) && t.passengers<t.capacity && Math.random()<0.35){
        t.passengers++; t.boarded['auto'+t.passengers]=Date.now();
      }
    });
    UI.live();
  },
  seedTraffic(){
    /* A few buses are already on the road when the demo opens. */
    const preset = [['DIU-07',0.34,26],['DIU-04',0.58,31],['DIU-09',0.15,12],['DIU-11',0.78,44]];
    preset.forEach(([busId,prog,pax])=>{
      const bus = DATA.buses.find(b=>b.id===busId);
      const trip = { id:'T-'+(++DATA.tripSeq), busId, routeId:bus.routeId, state: prog>0.9?'ARRIVED':'IN TRANSIT',
        startedAt:Date.now()-1000*60*24, endedAt:null, startedBy:bus.volunteerId, passengers:Math.min(pax,bus.capacity),
        boarded:{}, progress:prog, stopIndex:0, gps:true, manual:null, capacity:bus.capacity, lastUpdate:Date.now()-9000 };
      for(let i=0;i<trip.passengers;i++) trip.boarded['seed'+i]=Date.now();
      DATA.trips.push(trip); bus.status='active';
    });
    /* Yesterday's history. */
    for(let d=1; d<=6; d++){
      DATA.buses.slice(0,5).forEach((b,i)=>{
        DATA.trips.push({ id:'T-'+(900+d*10+i), busId:b.id, routeId:b.routeId, state:'COMPLETED',
          startedAt:Date.now()-d*864e5-1000*60*70, endedAt:Date.now()-d*864e5-1000*60*28,
          passengers:22+((d*7+i*5)%18), boarded:{}, progress:1, stopIndex:5, gps:false, manual:null, capacity:b.capacity});
      });
    }
    DATA.students.slice(0,14).forEach((s,i)=>DATA.boardings.push({tripId:'T-1043',busId:'DIU-07',studentId:s.studentId,at:Date.now()-1000*60*(9+i*3),by:'u_vl0'}));
    ['System boot','Nightly pass sync completed','Fleet health check passed'].forEach((d,i)=>
      Server.audit('system', null, d));
  }
};

    setTimeout(()=>n.remove(), 260); }, 4200);

function modal({title, body, confirm, danger, onConfirm, cancel='Cancel'}){
  const scrim = el('<div class="scrim"><div class="modal" role="dialog" aria-modal="true">'+
    '<div class="modal-h"><h3 style="flex:1"></h3><button class="iconbtn" data-x aria-label="Close">'+I.x()+'</button></div>'+
    '<div class="modal-b"></div>'+
    (confirm?'<div class="modal-f"><button class="btn" data-x></button><button class="btn '+(danger?'danger':'primary')+'" data-ok></button></div>':'')+
    '</div></div>');
  scrim.querySelector('h3').textContent = title;
  const b = scrim.querySelector('.modal-b');
  if(typeof body==='string') b.innerHTML = body; else b.appendChild(body);
  if(confirm){ scrim.querySelector('[data-ok]').textContent=confirm; $$('.modal-f [data-x]',scrim).forEach(x=>x.textContent=cancel); }
  const close = ()=>scrim.remove();
  $$('[data-x]',scrim).forEach(x=>x.onclick=close);
  scrim.onclick = e=>{ if(e.target===scrim) close(); };
  document.addEventListener('keydown', function esc(e){ if(e.key==='Escape'){ close(); document.removeEventListener('keydown',esc); } });
  const ok = scrim.querySelector('[data-ok]');
  if(ok) ok.onclick = async ()=>{ const r = onConfirm && await onConfirm(scrim); if(r!==false) close(); };
  $('#overlay').appendChild(scrim);
  setTimeout(()=>{ const f = scrim.querySelector('input,select,textarea,[data-ok]'); if(f) f.focus(); },40);
  return {close, root:scrim};
}

  const m = { ACTIVE:'green', INACTIVE:'yellow', EXPIRED:'red', active:'green', idle:'', maintenance:'yellow',
    BOARDING:'yellow','TRIP STARTED':'blue','IN TRANSIT':'green', ARRIVED:'blue', COMPLETED:'', SCHEDULED:'' };
  return '<span class="chip '+(m[s]||'')+'"><i class="dot'+(s==='IN TRANSIT'||s==='active'?' pulse':'')+'"></i>'+s+'</span>';
}
function seatBlock(pax, cap){
  const left = cap-pax, pct = Math.round(pax/cap*100);
  const cls = left===0?'full':(left<=5?'warn':'');
  return '<div><div class="between" style="margin-bottom:6px"><span class="mono" style="font-weight:600">'+pax+' / '+cap+' seats taken</span>'+
    (left===0?'<span class="chip red">Bus full</span>':'<span class="chip '+(left<=5?'yellow':'green')+'">'+left+' free</span>')+'</div>'+
    '<div class="seatbar '+cls+'"><i style="width:'+pct+'%"></i></div></div>';
}
function seatGrid(pax,cap){
  let h='<div class="seatgrid">'; for(let i=0;i<cap;i++) h+='<i class="'+(i<pax?'on':'')+'"></i>'; return h+'</div>';
}
function routeStrip(route, activeIndex, opts={}){
  return '<div class="strip">'+ route.stops.map((s,i)=>{
    const cls = activeIndex==null?'' : (i<activeIndex?'done':(i===activeIndex?'here':''));
    return '<div class="stop '+cls+'"><div class="pin"><b></b></div>'+
      '<div><div class="nm">'+escapeHtml(s.name)+'</div>'+
      (cls==='here'?'<div class="sub">Bus is here now</div>':(i===0?'<div class="sub">Starting point</div>':(i===route.stops.length-1?'<div class="sub">Final stop</div>':'')))+
      '</div><div class="tm">'+s.t+'</div></div>';
  }).join('')+'</div>';
}
function mapSvg(route, buses){
  const pts = route.stops.map(s=>s.x+','+s.y).join(' ');
  let m = '';
  (buses||[]).forEach(b=>{
    const p = busPoint(route, b.progress);
    m += '<g transform="translate('+p.x+','+p.y+')">'+
      '<circle r="4.6" fill="'+route.color+'" opacity=".2"><animate attributeName="r" values="4;7;4" dur="2.4s" repeatCount="indefinite"/></circle>'+
      '<rect x="-3.1" y="-2.3" width="6.2" height="4.6" rx="1.2" fill="'+route.color+'"/>'+
      '<text y="-4.4" text-anchor="middle" font-size="3.1" font-family="IBM Plex Mono, monospace" font-weight="600" fill="currentColor">'+b.busId+'</text></g>';
  });
  return '<div class="mapbox"><svg viewBox="0 0 100 58" role="img" aria-label="Route map for '+escapeHtml(route.name)+'">'+
    '<defs><pattern id="g" width="6" height="6" patternUnits="userSpaceOnUse"><path d="M6 0H0v6" fill="none" stroke="currentColor" stroke-width=".22" opacity=".14"/></pattern></defs>'+
    '<rect width="100" height="58" fill="url(#g)"/>'+
    '<polyline points="'+pts+'" fill="none" stroke="'+route.color+'" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" opacity=".35"/>'+
    '<polyline points="'+pts+'" fill="none" stroke="'+route.color+'" stroke-width="1.6" stroke-dasharray="3 3" stroke-linecap="round"/>'+
    route.stops.map((s,i)=>'<g><circle cx="'+s.x+'" cy="'+s.y+'" r="1.5" fill="var(--surface)" stroke="'+route.color+'" stroke-width="1"/>'+
      '<text x="'+s.x+'" y="'+(s.y+4.6)+'" text-anchor="middle" font-size="2.5" fill="currentColor" opacity=".72" font-family="IBM Plex Sans, sans-serif">'+escapeHtml(s.name)+'</text></g>').join('')+
    m+'</svg>'+
    '<div class="maplegend"><div class="row" style="gap:6px"><i class="dot" style="background:'+route.color+'"></i>'+escapeHtml(route.label)+'</div>'+
    '<div class="faint">Simulated GPS · updates every 3s</div></div></div>';
}
function busPoint(route, p){
  const n = route.stops.length-1, f = Math.max(0,Math.min(0.9999,p))*n, i=Math.floor(f), t=f-i;
  const a=route.stops[i], b=route.stops[Math.min(n,i+1)];
  return { x:+(a.x+(b.x-a.x)*t).toFixed(2), y:+(a.y+(b.y-a.y)*t).toFixed(2) };
}
function barChart(labels, values, unit){
  const max = Math.max(...values)*1.15;
  return '<svg viewBox="0 0 320 130" style="width:100%;height:auto" role="img">'+
    values.map((v,i)=>{ const w=320/values.length, h=v/max*98, x=i*w+w*0.2, y=104-h;
      return '<rect x="'+x+'" y="'+y+'" width="'+w*0.6+'" height="'+h+'" rx="3" fill="var(--green)" opacity="'+(0.55+0.45*v/max)+'"/>'+
        '<text x="'+(x+w*0.3)+'" y="'+(y-3)+'" text-anchor="middle" font-size="7.5" fill="currentColor" opacity=".65" font-family="IBM Plex Mono, monospace">'+v+'</text>'+
        '<text x="'+(x+w*0.3)+'" y="118" text-anchor="middle" font-size="8" fill="currentColor" opacity=".55">'+labels[i]+'</text>'; }).join('')+
    '<line x1="0" y1="105" x2="320" y2="105" stroke="currentColor" opacity=".18"/></svg>';
}
function lineChart(labels, values){
  const max=Math.max(...values)*1.2, min=0;
  const pts = values.map((v,i)=>(i*(320/(values.length-1)))+','+(104-(v-min)/(max-min)*94));
  return '<svg viewBox="0 0 320 130" style="width:100%;height:auto" role="img">'+
    '<polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--green)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<polyline points="0,105 '+pts.join(' ')+' 320,105" fill="var(--green)" opacity=".12" stroke="none"/>'+
    values.map((v,i)=>{const x=i*(320/(values.length-1)), y=104-(v-min)/(max-min)*94;
      return '<circle cx="'+x+'" cy="'+y+'" r="2.6" fill="var(--surface)" stroke="var(--green)" stroke-width="1.8"/>'+
      '<text x="'+x+'" y="118" text-anchor="middle" font-size="8" fill="currentColor" opacity=".55">'+labels[i]+'</text>';}).join('')+
    '</svg>';
}

const Theme = {
  current(){ const t = document.documentElement.getAttribute('data-theme');
    if(t) return t; return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'; },
  set(t){ document.documentElement.setAttribute('data-theme',t); try{ localStorage.setItem('diu.theme',t); }catch(e){} },
  toggle(){ this.set(this.current()==='dark'?'light':'dark'); },
  boot(){ try{ const t=localStorage.getItem('diu.theme'); if(t) document.documentElement.setAttribute('data-theme',t);
    else document.documentElement.removeAttribute('data-theme'); }catch(e){ document.documentElement.removeAttribute('data-theme'); } }
};

function parseTime(str){
  const m = /(\d+):(\d+)\s*(AM|PM)/i.exec(str); if(!m) return null;
  let h=+m[1]%12; if(/pm/i.test(m[3])) h+=12;
  const d=new Date(); d.setHours(h,+m[2],0,0); return d;
}
function scheduleFor(routeId){
  const r = DATA.routes.find(x=>x.id===routeId);
  const buses = DATA.buses.filter(b=>b.routeId===routeId);
  const slots = ['7:00 AM','9:30 AM','1:00 PM','5:15 PM'];
  return slots.map((t,i)=>{
    const dep = parseTime(t), now=new Date();
    const bus = buses[i%Math.max(1,buses.length)];
    const trip = bus && DATA.trips.find(x=>x.busId===bus.id && x.state!=='COMPLETED');
    let status = 'Scheduled';
    if(trip && i===0) status = trip.state==='ARRIVED'?'Arrived':'Running';
    else if(dep && dep<now) status='Departed';
    return { routeId, route:r.name, bus: bus?bus.id:'—', dep:t, depAt:dep, stops:r.stops, status, trip };
  });
}
function nextDeparture(routeId){
  const list = scheduleFor(routeId).filter(s=>s.depAt && s.depAt>new Date());
  return list[0] || scheduleFor(routeId)[0];
}
function countdownText(depAt){
  if(!depAt) return '—';
  let ms = depAt - Date.now();
  if(ms<0) ms += 864e5;
  const h=Math.floor(ms/36e5), m=Math.floor(ms%36e5/6e4), s=Math.floor(ms%6e4/1000);
  return (h>0? h+'h '+String(m).padStart(2,'0')+'m' : m+'m '+String(s).padStart(2,'0')+'s');
}
function greeting(){ const h=new Date().getHours();
  return h<12?'Good morning':(h<17?'Good afternoon':'Good evening'); }

      if(a==='gps'){ const t=myTrip(); await API.call('gps.toggle',{on:!t.gps}); toast(t.gps?'GPS marked unavailable':'GPS restored', t.gps?'Update the stop by hand until it returns.':'Automatic tracking is back on.', t.gps?'warn':''); }
      UI.live();

VIEWS.scanner = async (v)=>{
  const bus = DATA.buses.find(b=>b.id===State.user.busId);
  const routeStudents = DATA.students.filter(s=>s.routeId===bus.routeId);
  const others = DATA.students.filter(s=>s.routeId!==bus.routeId);
  v.innerHTML = `<div class="split">
    <div class="stack">
      <div class="card pad-lg">
        <div class="between" style="margin-bottom:14px"><h3>Handheld card reader</h3><span class="chip green"><i class="dot pulse"></i>Reader connected</span></div>
        <div class="scanner" id="sc">
          <div class="waves">${I.scan()}</div>
          <div style="font-family:var(--f-display);font-weight:700;font-size:19px" id="sct">Ready to scan</div>
          <p class="muted" style="font-size:14px;margin-top:4px" id="scs">Hold a student ID card against the reader.</p>
        </div>
        <button class="btn primary big block" id="scan" style="margin-top:14px">${I.scan()}Scan student card</button>
        <div class="row wrap" style="margin-top:10px;gap:8px">
          <button class="btn" data-sim="dup" style="font-size:13px">Scan the same card again</button>
          <button class="btn" data-sim="bad" style="font-size:13px">Scan an inactive pass</button>
          <button class="btn" data-sim="wrong" style="font-size:13px">Scan another route's card</button>
          <button class="btn" data-sim="unknown" style="font-size:13px">Scan an unknown card</button>
        </div>
      </div>
      <div class="card pad-lg" data-live="scSeats">${scSeatsInner()}</div>
    </div>
    <div class="stack">
      <div class="card pad-lg"><h3 style="margin-bottom:10px">Check a pass by ID</h3>
        <form id="pf" class="row" style="gap:8px"><input id="pq" type="text" placeholder="2024-1007" class="mono"><button class="btn" type="submit">Check</button></form>
        <div id="pres" style="margin-top:12px"></div></div>
      <div class="card pad-lg"><h3 style="margin-bottom:10px">Boarded on this trip</h3><div id="blist" data-live="scList">${scListInner()}</div></div>
    </div></div>`;
  let last = null;
  const sc = $('#sc'), sct = $('#sct'), scs = $('#scs');
  const setState = (cls, title, sub, extra)=>{ sc.className='scanner '+cls; sct.textContent=title; scs.innerHTML=escapeHtml(sub||'');
    const old=$('#scx',sc); if(old) old.remove(); if(extra){ const d=el('<div id="scx" style="margin-top:12px">'+extra+'</div>'); sc.appendChild(d);} };

  const run = async (uid)=>{
    setState('busy','Scanning…','Reading the card UID.');
    await new Promise(r=>setTimeout(r,700));
    try{
      const res = await API.call('rfid.scan',{uid});
      const st = res.student;
      if(res.result==='APPROVED'){
        last = uid;
        setState('ok','Boarding approved', '',
          `<dl class="kv" style="text-align:left;max-width:320px;margin:0 auto"><dt>Name</dt><dd>${escapeHtml(st.name)}</dd>
           <dt>Student ID</dt><dd class="mono">${st.studentId}</dd><dt>Pass</dt><dd>ACTIVE</dd>
           <dt>Route</dt><dd>${escapeHtml(routeName(st.routeId))}</dd><dt>Seat</dt><dd class="mono">${res.passengers} of ${res.capacity}</dd></dl>`);
        toast('Boarding approved', st.name+' · '+res.seatsLeft+' seats left');
      } else if(res.result==='DUPLICATE'){
        setState('bad','Already boarded this trip','The passenger count did not change.',
          `<p class="mono">${escapeHtml(st.name)} boarded at ${clock(res.boardedAt)} · count stays at ${res.passengers}/${res.capacity}</p>`);
        toast('Duplicate scan', st.name+' is already on board.','warn');
      } else {
        setState('bad','Boarding rejected', res.message, st?`<p class="mono">${escapeHtml(st.name)} · ${st.studentId}</p>`:'');
        toast('Boarding rejected', res.message,'err');
      }
    }catch(e){ setState('bad','Cannot scan', e.message); toast('Blocked', e.message,'err'); }
    UI.live();
    setTimeout(()=>{ if(sc.className!=='scanner busy') setState('','Ready to scan','Hold a student ID card against the reader.'); }, 6000);
  };
  $('#scan').onclick = ()=>{
    const pool = routeStudents.filter(s=>s.pass.status==='ACTIVE' && !(myTrip()&&myTrip().boarded[s.uid]));
    const pick = pool[Math.floor(Math.random()*pool.length)] || routeStudents[0];
    run(pick.uid);
  };
  $$('[data-sim]',v).forEach(b=>b.onclick=()=>{
    const k=b.dataset.sim;
    if(k==='dup'){ const t=myTrip(); const uid = last || (t && Object.keys(t.boarded).find(u=>u.includes(':')));
      if(!uid) return toast('Nothing to repeat','Scan a valid card first, then try again.','warn'); return run(uid); }
    if(k==='bad'){ const s=routeStudents.find(s=>s.pass.status!=='ACTIVE'); return run(s?s.uid:'04:00:X'); }
    if(k==='wrong'){ const s=others.find(s=>s.pass.status==='ACTIVE'); return run(s.uid); }
    return run('04:FF:DE:AD:99');
  });
  $('#pf').onsubmit = async (e)=>{
    e.preventDefault();
    try{
      const r = await API.call('pass.verify',{studentId:$('#pq').value.trim()});
      $('#pres').innerHTML = `<div class="card pad" style="box-shadow:none"><div class="between"><div><div style="font-weight:700">${escapeHtml(r.name)}</div>
        <div class="muted" style="font-size:13px">${escapeHtml(r.dept)} · ${escapeHtml(routeName(r.routeId))}</div></div>${statusChip(r.pass.status)}</div>
        <p class="faint" style="font-size:12.5px;margin-top:8px">Valid until ${r.pass.validUntil}</p></div>`;
    }catch(err){ $('#pres').innerHTML = '<p class="muted">'+escapeHtml(err.message)+'</p>'; }
  };
  UI.every(2000,()=>UI.live());
};

/* ------------------- Smart check-in & QR verification -------------- */
function qrMatrix(token, n){
  n = n||27;
  const bits = new Array(n*n).fill(0);
  let pool='';
  for(let i=0;i<10;i++) pool += Server.hash(token+'#'+i, 'qr');
  for(let i=0;i<n*n;i++){ const c=pool.charCodeAt(i%pool.length)+((i*31)%7); bits[i] = (c%2===0)?1:0; }
  const finder=(ox,oy)=>{ for(let y=0;y<7;y++) for(let x=0;x<7;x++){
      const on = (x===0||x===6||y===0||y===6) || (x>=2&&x<=4&&y>=2&&y<=4);
      const px=ox+x, py=oy+y; if(px<n&&py<n) bits[py*n+px]=on?1:0; } };
  const clear=(ox,oy)=>{ for(let y=-1;y<8;y++) for(let x=-1;x<8;x++){ const px=ox+x,py=oy+y;
      if(px>=0&&py>=0&&px<n&&py<n && (x<0||x>6||y<0||y>6)) bits[py*n+px]=0; } };
  [[0,0],[n-7,0],[0,n-7]].forEach(([x,y])=>{ clear(x,y); finder(x,y); });
  return {bits, n};
}
function qrSvg(token){
  const {bits,n} = qrMatrix(token);
  let r='';
  for(let y=0;y<n;y++) for(let x=0;x<n;x++) if(bits[y*n+x]) r+='<rect x="'+x+'" y="'+y+'" width="1" height="1"/>';
  return '<svg viewBox="-1 -1 '+(n+2)+' '+(n+2)+'" role="img" aria-label="Check-in code">'+
    '<rect x="-1" y="-1" width="'+(n+2)+'" height="'+(n+2)+'" fill="#fff"/><g fill="#06110E">'+r+'</g></svg>';
}

      ${!paid && !f.blocked? '<div class="lockbar" style="margin-top:12px">Pay the transport fee before boarding. Scanning with an unpaid fee raises a ৳800 fine and restricts access.</div>':''}`;
    $('#chist').innerHTML = f.history.length? f.history.map(c=>`<div class="logline">
      <span class="mono faint">${clock(c.at)}</span>
