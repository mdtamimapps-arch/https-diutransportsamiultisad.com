      : '<div class="empty"><p>No check-ins yet today.</p></div>';
  };
  paintFee(info);

  let tick=null, current=null;
  const idle = (msg)=>{
    clearInterval(tick);
    $('#qc').innerHTML = `<h3 style="margin-bottom:4px">Bus check-in</h3>
      <p class="muted" style="font-size:14px;margin-bottom:16px">${msg||'Generate a code just before you board '+escapeHtml(route.name)+'.'}</p>
      <div class="qrbox dead">${qrSvg('placeholder-'+Date.now())}</div>
      <button class="btn primary big block" id="gen" style="margin-top:16px">${I.scan()}Generate check-in code</button>`;
    $('#gen').onclick = gen;
  };
  const gen = async ()=>{
    try{
      const r = await API.call('checkin.create');
      current = r.token;
      $('#qc').innerHTML = `<h3 style="margin-bottom:4px">Show this to the scanner</h3>
        <p class="muted" style="font-size:14px;margin-bottom:14px">${escapeHtml(r.route)} · single use</p>
        <div class="qrbox">${qrSvg(r.token)}</div>
        <div class="ttl"><i id="ttl" style="width:100%"></i></div>
        <p class="mono" id="ttlt" style="margin-top:8px;font-size:13px">Valid for 90s</p>
        <p class="faint mono" style="font-size:11px;margin-top:6px;word-break:break-all">${escapeHtml(r.token.slice(0,34))}…</p>
        <button class="btn block" id="gen" style="margin-top:12px">Generate a new code</button>`;
      $('#gen').onclick = gen;
      const end = Date.now()+r.ttl;
      clearInterval(tick);
      tick = setInterval(()=>{
        const left = end-Date.now();
        if(left<=0){ idle('That code expired. Generate a fresh one when the bus arrives.'); return; }
        const el2=$('#ttl'); if(!el2){ clearInterval(tick); return; }
        el2.style.width = (left/r.ttl*100)+'%';
        el2.parentElement.classList.toggle('low', left<25000);
        $('#ttlt').textContent = 'Valid for '+Math.ceil(left/1000)+'s';
      }, 500);
      State.tickers.push(tick);
      toast('Check-in code ready','Hold your phone up to the scanner on the bus door.');
    }catch(e){
      idle(e.message);
      toast('Cannot check in', e.message, 'err');
    }
  };
  idle();
  UI.every(4000, async ()=>{ try{ paintFee(await API.call('checkin.self')); }catch(e){} });
};

VIEWS.qrscan = async (v)=>{
  const bus = DATA.buses.find(b=>b.id===State.user.busId);
  v.innerHTML = `<div class="split">
    <div class="stack">
      <div class="light" id="lamp">
        <div class="lamp">${I.scan()}</div>
        <h2 id="lt">Ready to scan</h2>
        <p class="muted" id="ls">Hold a student's check-in code in front of the reader.</p>
        <div id="lx" style="margin-top:12px"></div>
      </div>
      <div class="offbar" id="ob">
        <button class="sw" id="sw" aria-label="Offline mode"><i></i></button>
        <div style="flex:1"><div style="font-weight:600;font-size:14px" id="obt">Scanner is online</div>
          <div class="muted" style="font-size:12.5px" id="obs">Every scan is verified by the server straight away.</div></div>
        <button class="btn" id="sync" disabled>Sync <span class="mono" id="qn">0</span></button>
      </div>
      <div class="card pad-lg">
        <h3 style="margin-bottom:10px">Test a code</h3>
        <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px">
          <button class="btn primary" data-kind="valid">Valid code</button>
          <button class="btn" data-kind="repeat">Same code twice</button>
          <button class="btn" data-kind="stale">Code 2 minutes old</button>
          <button class="btn" data-kind="forged">Edited code</button>
          <button class="btn" data-kind="unpaid">Fee not paid</button>
          <button class="btn" data-kind="blocked">Restricted account</button>

      </div>
    </div>
    <div class="stack">
      <div class="card pad-lg" data-live="scSeats">${scSeatsInner()}</div>
      <div class="card pad-lg"><h3 style="margin-bottom:10px">Scans on this device</h3><div id="slog"><div class="empty"><p>Nothing scanned yet.</p></div></div></div>
    </div></div>`;

  let offline=false, queue=[], lastToken=null, log=[];
  const paintQ = ()=>{ $('#qn').textContent = queue.length; $('#sync').disabled = offline || queue.length===0; };
  const paintLog = ()=>{ $('#slog').innerHTML = log.length? log.slice(0,12).map(l=>`<div class="logline">
      <span class="mono faint">${clock(l.at)}</span>
      <span><span class="${l.ok?'ok':'no'}" style="font-weight:600">${l.ok?'GRANTED':'DENIED'}</span> · ${escapeHtml(l.who)}
      ${l.reason&&!l.ok?'<span class="faint"> — '+l.reason+'</span>':''}${l.queued?'<span class="chip yellow" style="margin-left:6px">queued</span>':''}</span></div>`).join('')
    : '<div class="empty"><p>Nothing scanned yet.</p></div>'; };
  const light = (cls, title, sub, extra)=>{
    $('#lamp').className='light '+cls;
    $('#lamp .lamp').innerHTML = cls==='granted'?I.check():(cls==='denied'?I.x():I.scan());
    $('#lt').textContent=title; $('#ls').textContent=sub||''; $('#lx').innerHTML=extra||'';
  };
  const show = (res, queued)=>{
    const who = res.student? res.student.name : 'Unknown code';
    if(queued){
      light('reading','Saved for sync','This scanner is offline. The code was accepted onto the queue and will be checked by the server when the connection returns.');
      log.unshift({at:Date.now(), ok:true, who:'Queued code', queued:true}); paintLog(); return;
    }
    if(res.result==='GRANTED'){
      light('granted','Access granted', who+' · seat '+res.passengers+' of '+res.capacity,
        '<div class="row" style="justify-content:center;gap:8px"><span class="chip green">Fee paid</span><span class="chip green">Pass active</span><span class="chip">'+res.seatsLeft+' seats left</span></div>');
      toast('Access granted', who+' checked in');
    } else {
      light('denied','Access denied', res.message,
        res.student? '<span class="chip red">'+res.reason.replace(/_/g,' ')+'</span> <span class="mono faint" style="font-size:12px">'+escapeHtml(res.student.name)+'</span>':'<span class="chip red">'+res.reason+'</span>');
      toast('Access denied', res.message, 'err');
    }
    log.unshift({at:Date.now(), ok:res.result==='GRANTED', who, reason:res.reason}); paintLog();
    UI.live();
    setTimeout(()=>{ if($('#lamp') && !$('#lamp').classList.contains('reading')) light('','Ready to scan',"Hold a student's check-in code in front of the reader."); }, 6000);
  };
  const doScan = async (token)=>{
    light('reading','Reading code…','');
    await new Promise(r=>setTimeout(r,520));
    if(offline){ queue.push({token, at:Date.now()}); paintQ(); show(null, true); return; }
    try{ show(await API.call('qr.verify',{token})); }
    catch(e){ light('denied','Cannot scan', e.message); toast('Blocked', e.message,'err'); }
  };
  $$('[data-kind]',v).forEach(b=>b.onclick=async()=>{
    const kind=b.dataset.kind;
    if(kind==='repeat'){ if(!lastToken) return toast('Nothing to repeat','Scan a valid code first.','warn'); return doScan(lastToken); }
    try{
      const r = await API.call('qr.demoToken',{kind});
      if(kind==='valid') lastToken = r.token;
      doScan(r.token);
    }catch(e){ toast('Cannot mint a test code', e.message,'err'); }
  });
  $('#sw').onclick = ()=>{
    offline=!offline;
    $('#sw').classList.toggle('on', offline);
    $('#ob').classList.toggle('on', offline);
    $('#obt').textContent = offline? 'Scanner is offline' : 'Scanner is online';
    $('#obs').textContent = offline? 'Codes are checked against the signature on the device and held in a queue.'
      : 'Every scan is verified by the server straight away.';
    paintQ();
    if(!offline && queue.length) toast('Back online', queue.length+' scan'+(queue.length===1?'':'s')+' waiting. Press Sync to send them.','warn');
  };
  $('#sync').onclick = async ()=>{
    const q = queue.slice(); queue=[]; paintQ();
    try{
      const r = await API.call('scan.sync',{queue:q});
      const ok = r.results.filter(x=>x.result==='GRANTED').length;
      log = r.results.map(x=>({at:x.at, ok:x.result==='GRANTED', who:x.student?x.student.name:'Unknown code', reason:x.reason, queued:false})).concat(log);
      paintLog(); UI.live();
      toast('Queue synced', ok+' of '+r.synced+' accepted by the server.');
    }catch(e){ toast('Sync failed', e.message,'err'); }
  };
  paintQ(); paintLog();
  UI.every(2500,()=>UI.live());
};

    <div class="card pad-lg">
      <h3 style="margin-bottom:6px">File a complaint</h3>
      <p class="muted" style="font-size:14px;margin-bottom:14px">Goes straight to the transport admin inbox with your name attached, so it can be followed up.</p>
      <form id="cf" class="stack" style="gap:12px">
        <div class="field"><label>Category</label><select id="ccat">${cats.map(c=>'<option>'+c+'</option>').join('')}</select></div>
        <div class="field"><label>Bus number (optional)</label><input id="cbus" type="text" placeholder="DIU-07" class="mono"></div>
        <div class="field"><label>What happened?</label><textarea id="ctxt" rows="4" placeholder="The 7:45 AM bus from Savar was 20 minutes late with no notice."></textarea></div>
        <button class="btn primary big" type="submit">Submit complaint</button>
      </form>
    </div>
    <div class="card pad-lg"><h3 style="margin-bottom:10px">Your complaints</h3><div id="mylist"></div></div>
  </div>`;

      <div class="between"><span class="chip">${escapeHtml(c.cat)}</span>${c.status==='OPEN'?'<span class="chip yellow">Pending</span>':'<span class="chip green">Resolved</span>'}</div>
      <p style="font-size:13.5px;margin-top:6px">${escapeHtml(c.text)}</p>
      <p class="faint" style="font-size:11.5px;margin-top:6px">${timeAgo(c.at)}${c.busId?' · '+c.busId:''}</p>
      ${c.response?'<div class="secnote" style="margin-top:8px">'+I.check()+'<span>'+escapeHtml(c.response)+'</span></div>':''}</div>`).join('')

/* ============================ ui/chatbot ============================ */
const Bot = {
  open:false, thread:[],
  greet(){ return "Hi "+State.user.name.split(' ')[0]+"! I'm the DIU SmartBus assistant. Ask me about your bus, seats, delays, fees, or how to reach the transport office."; },
  quickChips(){
    const base = ["Where's my bus?","Seats available?","Any delays?","Contact numbers"];
    if(State.user.role==='student') base.push('My fee status','File a complaint');
    return base;
  },
  answer(qRaw){
    const q = qRaw.toLowerCase();
    const routeId = State.user.routeId || (DATA.buses.find(b=>b.id===State.user.busId)||{}).routeId;
    const route = routeId? DATA.routes.find(r=>r.id===routeId) : null;
    const trip = routeId? DATA.trips.find(t=>t.routeId===routeId && t.state!=='COMPLETED') : (State.user.busId? myTrip():null);

    if(/seat|free|available|full/.test(q)){
      if(!trip) return "No bus is running on "+(route?route.name:'your route')+" right now, so there's nothing boarded yet.";
      const left = trip.capacity-trip.passengers;
      return trip.busId+" has "+trip.passengers+" of "+trip.capacity+" seats taken — "+(left===0?"it's full right now.":left+" seat"+(left===1?'':'s')+" free.");
    }
    if(/where|location|near|track/.test(q)){
      if(!trip) return "No bus is on the road for "+(route?route.name:'your route')+" at the moment. Check the schedule for the next departure.";
      const p = publicTrip(DATA.trips.find(t=>t.id===trip.id) || trip, State.user.role);
      return trip.busId+" is currently near "+p.nearStop+", updated "+timeAgo(p.lastUpdate)+".";
    }
    if(/delay|late|cancel|notice|update/.test(q)){
      const list = DATA.notices.filter(n=>!n.routeId||n.routeId===routeId).slice(0,2);
      if(!list.length) return "No delay or cancellation notices right now — service looks normal.";
      return "Latest notice: \""+list[0].title+"\" — "+list[0].body;
    }
    if(/fee|pay|due|fine/.test(q)){
      const st = DATA.students.find(s=>s.id===State.user.id);
      if(!st) return "Fee status is tracked for student accounts. Try signing in as a student to see this.";
      if(st.blocked) return "Your bus access is currently restricted: "+(st.blockReason||'')+" Visit the transport office to have it reviewed.";
      return st.fee.status==='PAID' ? "Your transport fee is paid, and you have ৳"+st.fee.fines+" in outstanding fines."
        : "Your transport fee shows as due. Pay at the transport office before boarding — boarding with an unpaid fee raises an automatic ৳800 fine.";
    }
    if(/complain|report|issue|problem/.test(q)) return "You can file a complaint any time from the Complaint box in the menu — it goes straight to the transport admin with your name attached.";
    if(/contact|phone|number|call|office/.test(q)){
      const c = DATA.contacts[0];
      return "Transport control room: "+c.phone+" ("+c.hours+"). Full list is under Transport office in the menu.";
    }
    if(/pass\b/.test(q)){
      const st = DATA.students.find(s=>s.id===State.user.id);
      return st ? "Your transport pass is "+st.pass.status+", valid until "+st.pass.validUntil+"." : "Open Transport pass from the menu to see its status.";
    }
    if(/hi|hello|hey|salam/.test(q)) return "Hello! Ask me about your bus location, seats, delays, fees, or the transport office contacts.";
    if(/thank/.test(q)) return "Glad to help! Anything else about your route or bus?";
    return "I can help with bus location, seat counts, delay notices, fee status, complaints, and office contacts. Try one of the quick questions below.";
  },
  render(){
    const old = $('#botpanel'); if(old) old.remove();
    if(!this.open) return;
    const p = el(`<div class="botpanel" id="botpanel">
      <div class="bot-h"><div class="avatar" style="width:32px;height:32px;color:var(--green-deep)">${I.ai()}</div>
        <div style="flex:1"><div style="font-weight:700;font-size:14px">DIU SmartBus Assistant</div><div class="faint" style="font-size:11px">Answers from live schedule &amp; account data</div></div>
        <button class="iconbtn" id="botx" style="width:30px;height:30px">${I.x()}</button></div>
      <div class="bot-msgs" id="botmsgs"></div>
      <div class="composer"><input id="boti" type="text" placeholder="Ask about your bus…" autocomplete="off"><button class="btn primary" id="bots">Send</button></div>
    </div>`);
    $('#overlay').appendChild(p);
    $('#botx').onclick = ()=>{ this.open=false; this.render(); };
    const paint = ()=>{
      $('#botmsgs').innerHTML = this.thread.map(m=> m.typing
        ? '<div class="bot-msg bot bot-typing"><span></span><span></span><span></span></div>'
        : '<div class="bot-msg '+(m.who==='me'?'me':'bot')+'">'+escapeHtml(m.text)+'</div>').join('') +
        (!this.thread.length ? '' : '') +
        '<div id="chipwrap">'+this.quickChips().map(c=>'<span class="bot-chip" data-q="'+escapeHtml(c)+'">'+escapeHtml(c)+'</span>').join('')+'</div>';
      const box=$('#botmsgs'); box.scrollTop=box.scrollHeight;
      $$('.bot-chip',box).forEach(c=>c.onclick=()=>ask(c.dataset.q));
    };
    const ask = async (text)=>{
      text = text.trim(); if(!text) return;
      this.thread.push({who:'me', text});
      this.thread.push({typing:true});
      paint();
      await new Promise(r=>setTimeout(r, 500+Math.random()*450));
      this.thread.pop();
      this.thread.push({who:'bot', text: this.answer(text)});
      paint();
    };
    if(!this.thread.length) this.thread.push({who:'bot', text:this.greet()});
    paint();
    $('#bots').onclick = ()=>{ const i=$('#boti'); ask(i.value); i.value=''; };
    $('#boti').onkeydown = (e)=>{ if(e.key==='Enter'){ const i=$('#boti'); ask(i.value); i.value=''; } };
    setTimeout(()=>$('#boti') && $('#boti').focus(), 50);
  },
  mount(){
    const old=$('#fab'); if(old) old.remove();
    if(!State.user) return;
    const b = el('<button class="fab" id="fab" aria-label="Ask the DIU SmartBus assistant">'+I.ai()+'</button>');
    b.onclick = ()=>{ this.open=!this.open; this.render(); };
    document.body.appendChild(b);
  }
};
